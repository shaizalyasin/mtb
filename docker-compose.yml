# Official cBioPortal, unmodified, pinned by tag. The MTB features are injected
# purely through the mounted config/frontend.json and served by the mtb-tools
# container -- no cBioPortal source is patched, and no cBioPortal image is
# rebuilt.
#
# Adapted from the official cbioportal-docker-compose at the last MySQL-era
# revision (a3aa5c9, cBioPortal 6.4.x), trimmed to what the demo needs.

# Pinned so the project name -- and therefore the volume and network names --
# does not silently change if the checkout directory is renamed. Without it
# Compose derives the name from the directory, and a rename orphans the seeded
# database volume.
name: mtb

services:
    cbioportal:
        image: ${DOCKER_IMAGE_CBIOPORTAL}
        container_name: mtb-cbioportal
        restart: unless-stopped
        environment:
            PORTAL_HOME: /cbioportal-webapp
            SHOW_DEBUG_INFO: 'true'
        ports:
            - '${CBIOPORTAL_PORT:-8080}:8080'
        volumes:
            - ./study:/study
            # Generated by ./init.sh from this image's own defaults, with only
            # the datasource lines rewritten. The entrypoint insists on finding
            # it at $PORTAL_HOME, hence the single-file mount.
            - ./config/application.properties:/cbioportal-webapp/application.properties:ro
            # THE injection point, read-only -- the portal only ever reads it.
            # Mounted as a directory, not a single file: editors replace files
            # rather than rewriting them in place, and a single-file bind mount
            # breaks the moment its inode changes ("no such file or directory"
            # on the next start, with the file plainly sitting there).
            - ./config:/mtb-config:ro
        depends_on:
            cbioportal-database:
                condition: service_healthy
            cbioportal-session:
                condition: service_started
        networks:
            - mtb-net
        # Standard official launch line, plus one argument: --frontend.config.
        # That single flag is the whole of "installing" the MTB features.
        #
        # The class name matters -- the image's entrypoint only runs its
        # database wait and migration when it sees org.cbioportal.PortalApplication
        # in the command.
        command: >
            /bin/sh -c "java -Xms2g -Xmx4g
            -cp '/cbioportal-webapp:/cbioportal-webapp/lib/*'
            org.cbioportal.PortalApplication
            --spring.config.location=/cbioportal-webapp/application.properties
            --authenticate=false
            --clickhouse_mode=false
            --session.service.url=http://cbioportal-session:5001/api/sessions/my_portal/
            --frontend.config=$${FRONTEND_CONFIG:-/mtb-config/frontend.json}"

    cbioportal-database:
        image: ${DOCKER_IMAGE_MYSQL}
        container_name: mtb-database
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: ${DB_MYSQL_DB_NAME}
            MYSQL_USER: ${DB_MYSQL_USERNAME}
            MYSQL_PASSWORD: ${DB_MYSQL_PASSWORD}
            MYSQL_ROOT_PASSWORD: ${DB_MYSQL_PASSWORD}
        volumes:
            # Both files are produced by ./init.sh. The schema is read out of
            # the pinned portal image itself, so it can never drift from it.
            - ./data/cgds.sql:/docker-entrypoint-initdb.d/01-cgds.sql:ro
            - ./data/seed.sql.gz:/docker-entrypoint-initdb.d/02-seed.sql.gz:ro
            - mtb_mysql:/var/lib/mysql
        command: --local-infile=1
        networks:
            - mtb-net
        healthcheck:
            # The seed import is slow; "container running" is not "database
            # ready". Wait until the reference data is actually there.
            #
            # The official compose asserts an exact row count (853). That number
            # is tied to one seed release -- seed 2.14.5, which is the one
            # cBioPortal 6.4.4 wants, has 852 -- so an equality test fails
            # forever on any seed bump. A threshold answers the real question
            # ("did the seed finish loading?") without needing maintenance.
            test:
                [
                    'CMD-SHELL',
                    'test 500 -lt "$$(mysql -hlocalhost -P3306 -u$$MYSQL_USER -p$$MYSQL_PASSWORD -e "SELECT COUNT(*) FROM type_of_cancer" cbioportal --skip-column-names --silent 2>/dev/null)"',
                ]
            interval: 10s
            timeout: 5s
            retries: 300
            start_period: 3m

    cbioportal-session:
        image: ${DOCKER_IMAGE_SESSION_SERVICE}
        container_name: mtb-session
        restart: unless-stopped
        environment:
            SERVER_PORT: 5001
            JAVA_OPTS: -Dspring.data.mongodb.uri=mongodb://cbioportal-session-database:27017/session-service
        depends_on:
            - cbioportal-session-database
        networks:
            - mtb-net

    cbioportal-session-database:
        image: ${DOCKER_IMAGE_MONGO}
        container_name: mtb-session-database
        restart: unless-stopped
        environment:
            MONGO_INITDB_DATABASE: session_service
        volumes:
            - mtb_mongo:/data/db
        networks:
            - mtb-net

    # The whole of "our features", as far as the deployment is concerned: a
    # static file server. Built from the sibling bundle repo so `up --build`
    # always serves current code.
    mtb-tools:
        # The Dockerfile lives in the bundle repo -- how the bundle is built is
        # the bundle's business, not the deployment's.
        build:
            context: ${MTB_TOOLS_CONTEXT:-https://github.com/shaizalyasin/mtb-clinical-tools.git}
        image: mtb-clinical-tools:local
        container_name: mtb-tools
        restart: unless-stopped
        ports:
            - '${MTB_TOOLS_PORT:-8081}:80'
        networks:
            - mtb-net

networks:
    mtb-net:

volumes:
    mtb_mysql:
    mtb_mongo:
