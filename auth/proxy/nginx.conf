worker_processes 1;
error_log /dev/stderr info;
pid logs/nginx.pid;

env KEYCLOAK_INTERNAL;
env KEYCLOAK_CLIENT;
env KEYCLOAK_SECRET;
env PUBLIC_URL;

events {
    worker_connections 1024;
}

http {
    lua_package_path '/usr/local/openresty/luajit/share/lua/5.1/?.lua;;';
    resolver local=on ipv6=off;

    # resty-openidc keeps its discovery document, JWKs and session state here.
    # Note this is the proxy's OWN session store -- it is not cBioPortal's.
    lua_shared_dict discovery 1m;
    lua_shared_dict jwks 1m;
    lua_shared_dict sessions 10m;

    include mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr [$time_local] "$request" $status '
                    'user="$upstream_http_x_userlogin"';
    access_log /dev/stdout main;

    client_body_temp_path /var/run/openresty/nginx-client-body;
    proxy_temp_path /var/run/openresty/nginx-proxy;
    fastcgi_temp_path /var/run/openresty/nginx-fastcgi;
    uwsgi_temp_path /var/run/openresty/nginx-uwsgi;
    scgi_temp_path /var/run/openresty/nginx-scgi;

    sendfile on;
    keepalive_timeout 65;

    include /etc/nginx/conf.d/*.conf;
}
