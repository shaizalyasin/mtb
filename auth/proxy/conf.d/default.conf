# One origin for everything the browser touches: cBioPortal, Keycloak, the MTB
# bundle, and the MTB backend. That is what makes "no additional token handling"
# true -- cookies are sent automatically because every request is same-origin.

init_by_lua_block {
    openidc = require("resty.openidc")
    cjson = require("cjson")

    -- The discovery document is supplied as a table rather than a URL, because
    -- the two sides of an OIDC flow need different addresses for the same
    -- Keycloak:
    --
    --   * the browser is redirected to authorization_endpoint, so that must be
    --     the public origin;
    --   * the proxy calls token_endpoint and jwks_uri itself, from inside the
    --     compose network.
    --
    -- Letting resty-openidc fetch discovery from the public URL makes it use
    -- public addresses for both, and its cosocket resolver is Docker's embedded
    -- DNS, which has no answer for "localhost" -- so the server-side call fails
    -- with "localhost could not be resolved" even though the browser reaches it
    -- perfectly well. /etc/hosts does not help; nginx's resolver does not read
    -- it.
    --
    -- issuer stays public because that is what Keycloak stamps into the token,
    -- and it is what gets validated.
    function mtb_opts()
        local public_url = os.getenv("PUBLIC_URL")
        local internal = os.getenv("KEYCLOAK_INTERNAL")
        local realm = "/auth/realms/mtb/protocol/openid-connect"
        return {
            discovery = {
                issuer = public_url .. "/auth/realms/mtb",
                authorization_endpoint = public_url .. realm .. "/auth",
                token_endpoint = internal .. realm .. "/token",
                token_endpoint_auth_methods_supported = { "client_secret_post" },
                userinfo_endpoint = internal .. realm .. "/userinfo",
                jwks_uri = internal .. realm .. "/certs",
                end_session_endpoint = public_url .. realm .. "/logout",
            },
            client_id = os.getenv("KEYCLOAK_CLIENT"),
            client_secret = os.getenv("KEYCLOAK_SECRET"),
            redirect_uri = public_url .. "/mtb/redirect",
            logout_path = "/mtb/logout",
            redirect_after_logout_uri = public_url .. "/",
            ssl_verify = "no",
            accept_none_alg = false,
            renew_access_token_on_expiry = true,
            session_contents = { id_token = true, access_token = true },
        }
    end

    -- Mirrors lua_auth_config.lua in MTB-cBioPortal: pull the display name and
    -- the client roles out of the token and hand them to the backend as
    -- headers, so the backend never deals with OIDC itself.
    function mtb_forward_identity(res)
        local client = os.getenv("KEYCLOAK_CLIENT")
        local login, name, roles = "unknown", "Unknown", "no_roles"

        pcall(function()
            login = res.id_token.preferred_username or login
            name = res.id_token.name or name
        end)

        pcall(function()
            local jwt = require("resty.jwt")
            local decoded = jwt:load_jwt(res.access_token)
            local ra = decoded.payload.resource_access
            if ra and ra[client] and ra[client].roles then
                roles = cjson.encode(ra[client].roles)
            end
        end)

        ngx.req.set_header("X-USERLOGIN", login)
        ngx.req.set_header("X-USERNAME", name)
        ngx.req.set_header("X-USERROLES", roles)
        return login, name, roles
    end
}

server {
    # Deliberately the same port the browser uses. resty-openidc has to fetch
    # the discovery document and call the token endpoint server-side, and both
    # URLs come from PUBLIC_URL -- so "localhost:8090" has to mean the same
    # thing inside this container as it does in the browser. Listening on 8080
    # and publishing 8090 would break discovery with a connection refused.
    listen 8090;
    server_name _;
    client_max_body_size 20m;

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;

    # --- Keycloak, same-origin -------------------------------------------
    # Served here rather than on its own port so the token issuer is identical
    # whether it is the browser or the proxy asking.
    location /auth/ {
        proxy_pass http://keycloak:8080;
    }

    # --- The MTB bundle, same-origin -------------------------------------
    # The base demo serves this cross-origin on :8081, which is fine for
    # loading a script. It is served here as well to show the same-origin
    # option, which is what you want once a CSP is in play.
    location /mtb-tools/ {
        proxy_pass http://mtb-tools/;
        add_header Cache-Control "no-store" always;
    }

    # --- Establishing the MTB session ------------------------------------
    # Top-level navigation, so the full redirect dance to Keycloak is fine
    # here. The frontend opens this in a popup; on return the page closes
    # itself and the session cookie is set for the whole origin.
    location = /mtb/login {
        default_type text/html;
        access_by_lua_block {
            local res, err = openidc.authenticate(mtb_opts())
            if err then
                ngx.status = 500
                ngx.say("MTB login failed: " .. err)
                ngx.exit(ngx.HTTP_OK)
            end
            ngx.ctx.identity = { mtb_forward_identity(res) }
        }
        content_by_lua_block {
            local id = ngx.ctx.identity or {}
            ngx.say([[<!doctype html><meta charset="utf-8"><title>MTB login</title>]]
                .. [[<body style="font:14px system-ui;padding:24px">]]
                .. [[<p>Signed in as <strong>]] .. (id[2] or "?") .. [[</strong>.</p>]]
                .. [[<p>You can close this window.</p>]]
                .. [[<script>if(window.opener){window.opener.postMessage({mtbLogin:true},"*");setTimeout(()=>window.close(),400)}</script>]])
        }
    }

    location = /mtb/logout {
        access_by_lua_block {
            openidc.authenticate(mtb_opts())
        }
    }

    location = /mtb/redirect {
        access_by_lua_block {
            local res, err = openidc.authenticate(mtb_opts())
            if err then
                ngx.status = 500
                ngx.say("MTB redirect failed: " .. err)
                ngx.exit(ngx.HTTP_OK)
            end
        }
    }

    # --- The MTB backend (FhirSpark's position) --------------------------
    # Reads are open; writes require a session. This mirrors MTB-cBioPortal,
    # where lua_auth_config is skipped when $request_method = GET.
    #
    # The important detail: authenticate() is called with unauth_action
    # "deny", so an unauthenticated write gets 401 instead of a 302 to
    # Keycloak. A redirect is correct for a page navigation and useless for a
    # fetch() -- the browser follows it and the caller gets Keycloak's HTML
    # login page instead of an actionable status.
    location /mtb/ {
        access_by_lua_block {
            if ngx.req.get_method() ~= "GET" then
                local res, err = openidc.authenticate(mtb_opts(), nil, "deny")
                if err or not res then
                    ngx.status = 401
                    ngx.header.content_type = "application/json"
                    ngx.say(cjson.encode({
                        error = "login_required",
                        loginUrl = "/mtb/login",
                        detail = err or "no MTB session",
                    }))
                    ngx.exit(ngx.HTTP_OK)
                end
                mtb_forward_identity(res)
            end
        }
        proxy_pass http://mtb-backend:3001;
    }

    # --- cBioPortal ------------------------------------------------------
    location / {
        proxy_pass http://cbioportal:8080;
        proxy_read_timeout 300s;
    }
}
