# Auth overlay: puts Keycloak and an OpenResty proxy in front of the base demo,
# reproducing the MTB-cBioPortal authentication path, so the claim that a
# mounted tab can reach an authenticated backend "without additional token
# handling" can actually be tested.
#
#   docker compose -f docker-compose.yml -f auth/docker-compose.yml up -d --build
#
# With this overlay the portal is reached through the proxy on the same port as
# before, and everything the browser touches -- cBioPortal, Keycloak, the
# bundle, the MTB backend -- is one origin.

services:
    # The portal stops publishing its own port; the proxy fronts it, and it
    # switches to the custom_tabs config that turns on the backend panel and
    # loads the bundle same-origin.
    cbioportal:
        ports: !override []
        environment:
            PORTAL_HOME: /cbioportal-webapp
            SHOW_DEBUG_INFO: 'true'
            FRONTEND_CONFIG: /mtb-auth/frontend.json
        volumes:
            - ./auth:/mtb-auth:ro

    # Same for the bundle: still reachable cross-origin on 8081 for the base
    # demo's sake, and also proxied at /mtb-tools/ for the same-origin case.

    keycloak:
        image: quay.io/keycloak/keycloak:26.0
        container_name: mtb-keycloak
        restart: unless-stopped
        command: start-dev --import-realm
        environment:
            KEYCLOAK_ADMIN: admin
            KEYCLOAK_ADMIN_PASSWORD: admin
            # Served under /auth on the public origin. Pinning the hostname
            # keeps the token issuer identical for the browser and for the
            # proxy, which is the usual reason Keycloak-behind-a-proxy fails.
            KC_HTTP_RELATIVE_PATH: /auth
            KC_HOSTNAME: ${PUBLIC_URL:-http://localhost:9090}/auth
            KC_HOSTNAME_STRICT: 'false'
            KC_HTTP_ENABLED: 'true'
            KC_PROXY_HEADERS: xforwarded
            KC_HEALTH_ENABLED: 'true'
        volumes:
            - ./auth/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
        networks:
            - mtb-net
        # No healthcheck: resty-openidc fetches the discovery document lazily
        # on the first authenticated request, so nothing here depends on
        # Keycloak being ready at startup. verify-auth.sh waits for the realm
        # before it starts asserting.

    mtb-backend:
        image: node:22-alpine
        container_name: mtb-backend
        restart: unless-stopped
        working_dir: /app
        command: node server.js
        volumes:
            - ./auth/backend:/app:ro
        networks:
            - mtb-net

    cbioproxy:
        build:
            context: ./auth/proxy
        image: mtb-cbioproxy:local
        container_name: mtb-proxy
        restart: unless-stopped
        environment:
            PUBLIC_URL: ${PUBLIC_URL:-http://localhost:9090}
            KEYCLOAK_INTERNAL: http://keycloak:8080
            KEYCLOAK_CLIENT: fhirspark
            KEYCLOAK_SECRET: fhirspark-demo-secret
        # Host and container port are identical on purpose: the proxy calls
        # Keycloak's token endpoint itself using PUBLIC_URL, so that origin
        # must resolve the same inside the container as in the browser.
        # entrypoint.sh derives the listen port from PUBLIC_URL.
        ports:
            - '${CBIOPORTAL_PORT:-9090}:${CBIOPORTAL_PORT:-9090}'
        depends_on:
            keycloak:
                condition: service_started
            cbioportal:
                condition: service_started
            mtb-backend:
                condition: service_started
            mtb-tools:
                condition: service_started
        networks:
            - mtb-net
