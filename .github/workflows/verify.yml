# Proves the decoupling claim on every push: bring up the official cBioPortal
# image unmodified, inject the bundle by config alone, and assert the tab mounts
# and reads the live store.
#
# The workflow_dispatch input is the upgrade check from
# mtb-clinical-tools/CONTRACT.md, automated. To evaluate a new cBioPortal
# release, run this with that tag. Green means the mount contract still holds
# and the upgrade is a one-line change to .env. Red names the criterion that
# broke.
name: verify

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      cbioportal_image:
        description: 'cBioPortal image to test against (e.g. cbioportal/cbioportal:6.4.5)'
        required: false
        default: ''

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out the deployment repo
        uses: actions/checkout@v4

      # The bundle lives in its own repo precisely because it has its own
      # lifecycle. CI has to bring the two together, the same way a developer
      # checks them out side by side.
      - name: Check out the bundle repo
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.MTB_TOOLS_REPO || format('{0}/mtb-clinical-tools', github.repository_owner) }}
          ref: ${{ vars.MTB_TOOLS_REF || 'main' }}
          path: mtb-clinical-tools

      - name: Point the deployment at the checked-out bundle
        run: echo "MTB_TOOLS_CONTEXT=./mtb-clinical-tools" >> .env

      - name: Override the cBioPortal image
        if: inputs.cbioportal_image != ''
        run: |
          sed -i "s|^DOCKER_IMAGE_CBIOPORTAL=.*|DOCKER_IMAGE_CBIOPORTAL=${{ inputs.cbioportal_image }}|" .env
          grep '^DOCKER_IMAGE_CBIOPORTAL=' .env

      # CI verifies the mount contract, and that takes exactly one study: the
      # one verify.sh drives. The default list in .env also carries
      # msk_chord_2024, 333 MB of data files and a three-hour import. It is
      # there so the Prognosis tab has real MSK-IMPACT inputs to score locally.
      # It proves nothing here that the small study does not, and no CI budget
      # can hold it.
      - name: Import only the study being verified
        run: |
          set -a && . ./.env && set +a
          echo "DATAHUB_STUDY=${VERIFY_STUDY_ID:-${DATAHUB_STUDY%% *}}" >> .env
          grep '^DATAHUB_STUDY=' .env

      - name: Download schema, seed database and demo study
        run: ./init.sh

      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 1200

      - name: Import the demo study
        run: ./import-study.sh

      - name: Wait for the portal
        run: |
          set -a && . ./.env && set +a
          timeout 300 bash -c "until curl -sf http://localhost:${CBIOPORTAL_PORT}/api/studies >/dev/null; do sleep 5; done"

      - name: Verify the mount contract
        run: ./verify.sh

      - name: Collect diagnostics
        if: failure()
        run: docker compose logs --tail 300 > compose-logs.txt || true

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-output
          path: |
            *.png
            compose-logs.txt
          if-no-files-found: ignore

  # The Prognosis tab and the risk service behind it. A separate job rather
  # than more steps above, because the base demo has to stay provable without
  # the overlay: if the model service breaks, 'verify' must still go green on
  # its own, which is the whole claim risk/ is an overlay at all.
  #
  # Among its twelve checks is the one that matters most and cannot be argued
  # in prose: it reads the POST body the page actually sends and fails if a
  # study, patient or sample identifier appears anywhere in it.
  verify-risk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out the deployment repo
        uses: actions/checkout@v4

      - name: Check out the bundle repo
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.MTB_TOOLS_REPO || format('{0}/mtb-clinical-tools', github.repository_owner) }}
          ref: ${{ vars.MTB_TOOLS_REF || 'main' }}
          path: mtb-clinical-tools

      # The model and its artifacts are committed there, so nothing is trained
      # here. The image build is a pip install.
      - name: Check out the model repo
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.MTB_RISK_REPO || format('{0}/mtb-survival-model', github.repository_owner) }}
          ref: ${{ vars.MTB_RISK_REF || 'main' }}
          path: mtb-survival-model

      - name: Point the deployment at the checked-out repos
        run: |
          set -a && . ./.env && set +a
          {
            echo "MTB_TOOLS_CONTEXT=./mtb-clinical-tools"
            echo "MTB_RISK_CONTEXT=./mtb-survival-model"
            echo "DATAHUB_STUDY=${VERIFY_STUDY_ID:-${DATAHUB_STUDY%% *}}"
          } >> .env
          tail -3 .env

      - name: Override the cBioPortal image
        if: inputs.cbioportal_image != ''
        run: |
          sed -i "s|^DOCKER_IMAGE_CBIOPORTAL=.*|DOCKER_IMAGE_CBIOPORTAL=${{ inputs.cbioportal_image }}|" .env
          grep '^DOCKER_IMAGE_CBIOPORTAL=' .env

      - name: Download schema, seed database and demo study
        run: ./init.sh

      - name: Start the stack with the risk overlay
        run: |
          docker compose -f docker-compose.yml -f risk/docker-compose.yml \
            up -d --build --wait --wait-timeout 1200

      - name: Import the demo study
        run: ./import-study.sh

      - name: Wait for the portal
        run: |
          set -a && . ./.env && set +a
          timeout 300 bash -c "until curl -sf http://localhost:${CBIOPORTAL_PORT}/api/studies >/dev/null; do sleep 5; done"

      - name: Verify the Prognosis tab
        run: ./risk/verify-risk.sh

      - name: Collect diagnostics
        if: failure()
        run: |
          docker compose -f docker-compose.yml -f risk/docker-compose.yml \
            logs --tail 300 > compose-logs.txt || true

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-risk-output
          path: |
            *.png
            compose-logs.txt
          if-no-files-found: ignore
